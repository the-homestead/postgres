name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning container/*.sh scripts/*.sh scripts/lib/*.sh keys/generate-certs.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: container/Dockerfile
          failure-threshold: error

  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: bake file parses
        working-directory: container
        run: docker buildx bake --print all dev ci > /dev/null
