name: Build

# Pull requests build the amd64 image and smoke-test it; nothing is pushed.
# Pushes to master and version tags build every platform, smoke-test the
# amd64 image, then push to ghcr.io/the-homestead/postgres.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Bake target to build and push
        type: choice
        default: full
        options: [full, minimal, vector, analytics, all]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  REPOSITORY: postgres

jobs:
  test:
    name: Build and smoke-test (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hosted runners start with ~14 GB free; the Rust extension builds need more.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force > /dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: container
          files: docker-bake.hcl
          targets: full
          load: true
          set: |
            full.platform=linux/amd64
            full.tags=postgres-smoke:ci
            full.cache-from=type=gha,scope=full-amd64
            full.cache-to=type=gha,scope=full-amd64,mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh postgres-smoke:ci

  publish:
    name: Build and push
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Hosted runners start with ~14 GB free; the Rust extension builds need more.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force > /dev/null
          df -h /

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from the bake file: <TAG>, <TAG>-<target>, pg18-<target>.
      # master pushes TAG=18; a v* tag pushes TAG=<tag name without the v>.
      - name: Tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=18" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/bake-action@v6
        env:
          TAG: ${{ steps.tag.outputs.value }}
        with:
          source: .
          workdir: container
          files: docker-bake.hcl
          targets: ${{ inputs.target || 'full' }}
          push: true
          set: |
            *.cache-from=type=gha,scope=${{ inputs.target || 'full' }}
            *.cache-to=type=gha,scope=${{ inputs.target || 'full' }},mode=max
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
