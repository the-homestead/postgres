# PostgreSQL runtime config for this image.
# You can mount this file and start with:
#   postgres -c config_file=/etc/postgresql/postgresql.conf

shared_preload_libraries = 'timescaledb,pg_cron,safeupdate,pgaudit,pg_squeeze,pg_later,anon'
cron.database_name = 'postgres'
listen_addresses = '*'

wal_level = logical
wal_compression = on
max_wal_senders = 4

archive_mode = on
archive_command = 'test -f /pgbackrest/repo/archive/default/archive.info && pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=default archive-push %p || true'
archive_timeout = 1800

ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file = '/var/lib/postgresql/server.key'
ssl_ca_file =  '/var/lib/postgresql/rootCA.crt'

# Optional addon tuning examples (disabled by default)

